name: Build & publish installers
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win nsis portable --x64 --publish never
          - os: macos-latest
            cmd: npx electron-builder --mac dmg --publish never
          - os: ubuntu-latest
            cmd: npx electron-builder --linux AppImage --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: office-share-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: Office Share ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          make_latest: true
          body: |
            ## Download
            - **Windows:** `OfficeShare-Setup-*.exe` (recommended installer) or `OfficeShare-Portable-*.exe` (no install)
            - **Mac:** `.dmg`  ·  **Linux:** `.AppImage`

            Install on every office laptop and type the **same office key**. Laptops on the same WiFi find each other automatically.
            Windows may show "unknown publisher": click **More info → Run anyway**.
